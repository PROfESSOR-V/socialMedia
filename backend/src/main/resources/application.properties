spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=-1
# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Cashfree Configuration
cashfree.client-id=${CASHFREE_CLIENT_ID}
cashfree.client-secret=${CASHFREE_CLIENT_SECRET}
cashfree.webhook.secret=${CASHFREE_WEBHOOK_SECRET}
cashfree.base-url=https://api.cashfree.com/pg


# Use the PORT environment variable provided by Render
server.port=${PORT:8080}



# Shiprocket Configuration
shiprocket.email=${SHIPROCKET_EMAIL}
shiprocket.password=${SHIPROCKET_PASSWORD}
shiprocket.webhook.token=${SHIPROCKET_WEBHOOK_TOKEN}




# Shipmozo
shipmozo.public-key=${SHIPMOZO_PUBLIC_KEY:dummy_public_key}
shipmozo.private-key=${SHIPMOZO_PRIVATE_KEY:dummy_private_key}
shipmozo.base-url=https://shipping-api.com/app/api/v1

# ===============================
# PERFORMANCE & OPTIMIZATION
# ===============================
# Enable GZIP Data Compression for faster API responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Tune Tomcat Thread Pool for higher concurrency
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ===============================
# MSG91 WhatsApp OTP
# ===============================
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.integrated-number=${MSG91_INTEGRATED_NUMBER}
