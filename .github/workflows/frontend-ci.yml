name: Next.js Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        continue-on-error: true # Might fail initially if there are strict lint errors

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
        env:
          # Prevents build from attempting to call external DB locally
          NEXT_PUBLIC_API_URL: http://localhost:8080
